[workspace]
members = [
    "crates/app",
    "crates/backend-cuda",
    "crates/backend-host",
    "crates/common",
    "crates/config",
    "crates/inference",
    "crates/session",
]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Enoch Jung (@enochjung)"]

[workspace.dependencies]
libc = "0.2.186"
cuda-async = { git = "https://github.com/NVlabs/cuda-oxide.git", package = "cuda-async" }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", package = "cuda-core" }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", package = "cuda-device" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", package = "cuda-host" }

app = { path = "crates/app" }
backend-cuda = { path = "crates/backend-cuda" }
backend-host = { path = "crates/backend-host" }
common = { path = "crates/common" }
config = { path = "crates/config" }
inference = { path = "crates/inference" }
session = { path = "crates/session" }